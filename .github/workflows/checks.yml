name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.13 is the Python bundled in the app (config/runtime.json);
        # 3.9 is macOS's /usr/bin/python3, used by the build and helper scripts.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover -s tests -v
      - run: for script in scripts/*.sh; do bash -n "$script"; done
  native-app:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build-setup-app.sh
