# Builds the app and saves a PNG of every page (light and dark) using the smoke-test data,
# so the UI can be reviewed without a Mac. They are force-pushed to the ci-screenshots branch
# (one commit, overwritten each run) and also uploaded as an artifact.
name: Screenshots
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths: ["setup/**", "scripts/**", "assets/**", ".github/workflows/screenshots.yml"]
permissions:
  contents: write
jobs:
  capture:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/build-setup-app.sh
      - run: |
          mkdir -p build/screenshots
          for appearance in light dark; do
            COUCH_CUBE_SMOKE_CAPTURE="$PWD/build/screenshots" \
              build/CouchCube.app/Contents/MacOS/ConsoleSetup --smoke-test --smoke-flow --appearance "$appearance"
          done
          ls build/screenshots | wc -l
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots/page-*.png
      - name: Publish to the ci-screenshots branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          cd build/screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add page-*.png
          git commit -qm "Screenshots of $SOURCE_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
