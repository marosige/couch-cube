# One-off: removes the pre-SemVer test releases and tags (v0.3.0-alpha.*,
# v0.1-alpha.1) after versioning restarted at v0.1.0-alpha.1. Runs once when
# this file lands on main, and can be re-run by hand; it is safe to repeat.
# Delete this workflow after it has run.
name: Remove old releases
on:
  push:
    branches: [main]
    paths: [.github/workflows/remove-old-releases.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for tag in v0.1-alpha.1 v0.3.0-alpha.1 v0.3.0-alpha.2 v0.3.0-alpha.3 v0.3.0-alpha.4 \
                     v0.3.0-alpha.5 v0.3.0-alpha.6 v0.3.0-alpha.7; do
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release delete "$tag" --yes --cleanup-tag
              echo "Deleted release and tag $tag"
            elif gh api "repos/$GH_REPO/git/refs/tags/$tag" >/dev/null 2>&1; then
              gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$tag"
              echo "Deleted tag $tag"
            else
              echo "Already gone: $tag"
            fi
          done
