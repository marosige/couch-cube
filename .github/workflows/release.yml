# Releases are driven by config/release.json (see scripts/version.py):
# when its version changes on main and no tag exists for it yet, this builds,
# verifies and publishes v<version>. Pre-releases (-alpha.N, -beta.N, -rc.N)
# are published as GitHub pre-releases; stable versions become "Latest".
# Run it manually to build and verify the installer without publishing.
name: Release
on:
  push:
    branches: [main]
    paths: [config/release.json]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      dmg: ${{ steps.version.outputs.dmg }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          for field in version tag dmg prerelease; do
            echo "$field=$(python3 scripts/version.py get "$field")" >> "$GITHUB_OUTPUT"
          done
          tag="$(python3 scripts/version.py get tag)"
          if [ "$EVENT_NAME" = push ] && ! git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
  dmg:
    needs: plan
    if: github.event_name == 'workflow_dispatch' || needs.plan.outputs.publish == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/select-xcode.sh
      - run: /usr/bin/python3 -B -m unittest discover -s tests -q
      - run: bash scripts/package-release.sh
      - run: /usr/bin/python3 -B scripts/verify-release.py "build/${{ needs.plan.outputs.dmg }}"
      - uses: actions/upload-artifact@v4
        with:
          name: CouchCube-arm64
          path: |
            build/*.dmg
            build/*-SSD.zip
  publish:
    needs: [plan, dmg]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CouchCube-arm64
          path: artifacts
      - name: Publish ${{ needs.plan.outputs.tag }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then
            flags=(--prerelease --latest=false)
            notes="Early test build for Apple Silicon Macs running macOS 13+. Back up your data before testing."
          else
            flags=(--latest)
            notes="Couch Cube for Apple Silicon Macs running macOS 13+."
          fi
          notes="$notes

          **Install:** open the DMG and drag CouchCube.app to Applications.
          **External SSD:** unzip the SSD pack onto your SSD, open CouchCube.app and finish Setup before adding games. The ZIP contains empty game folders, not a preconfigured library.

          Not notarized yet: if macOS says it \"could not verify CouchCube.app\", copy it to Applications and run once in Terminal:
          \`sudo xattr -dr com.apple.quarantine /Applications/CouchCube.app\`

          No games, BIOS, firmware or keys are included. Steam storage and shortcuts are configured manually. Switch emulator setup is manual."
          gh release create "$TAG" --target "$GITHUB_SHA" "${flags[@]}" \
            --title "Couch Cube $VERSION" --notes "$notes" \
            artifacts/*.dmg artifacts/*-SSD.zip
