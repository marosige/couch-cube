name: Build Couch Cube installer
on:
  push:
    tags:
      - "v0.3.0-alpha.*"
  workflow_dispatch:
    inputs:
      publish_draft:
        description: "Create a draft GitHub Release (requires repository owner's publication approval)"
        type: boolean
        default: false
      tag:
        description: "Existing version tag for an approved draft release (e.g. v0.3.0)"
        type: string
        default: "v0.3.0"
permissions:
  contents: read
jobs:
  dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.publish_draft && inputs.tag || github.ref }}
      - name: Validate alpha tag
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: '[[ "$RELEASE_TAG" =~ ^v0\.3\.0-alpha\.[0-9]+$ ]]'
      - run: /usr/bin/python3 -B -m unittest discover -s tests -q
      - run: bash scripts/package-release.sh
      - run: /usr/bin/python3 -B scripts/verify-release.py build/CouchCube-0.3.0-arm64.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: CouchCube-arm64
          path: |
            build/*.dmg
  publish-release:
    if: github.event_name == 'push' || inputs.publish_draft
    needs: dmg
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: CouchCube-arm64
          path: artifacts
      - name: Publish alpha or create explicitly requested draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            [[ "$RELEASE_TAG" =~ ^v0\.3\.0-alpha\.[0-9]+$ ]]
            gh release create "$RELEASE_TAG" --verify-tag --prerelease --latest=false \
              --title "Couch Cube ${RELEASE_TAG#v} (Apple Silicon)" \
              --notes "Early alpha for Apple Silicon Macs running macOS 13+. One download: open the DMG and drag CouchCube.app to Applications. For an SSD, open Setup in the app to copy this app or explicitly prepare a new drive. Internal app version: 0.3.0. Ad-hoc signed, not notarized: macOS may require explicit approval in Privacy & Security. No games, BIOS, firmware or keys included. Steam storage and shortcuts are configured manually. Switch emulator setup is manual with no verified automatic download. Back up data before testing. Physical SSD erase and login/controller hotplug have not been exercised on a test Mac." \
              artifacts/*.dmg
          else
            test "$RELEASE_TAG" = v0.3.0
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Couch Cube 0.3.0 (Apple Silicon)" \
              --notes "Apple Silicon macOS 13+. Ad-hoc signed; not notarized. See README for storage and SSD-preparation limitations." \
              artifacts/*.dmg
          fi
