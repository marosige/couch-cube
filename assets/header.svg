    <text x="-85" y="-40" font-size="122" font-weight="650" letter-spacing="-4" fill="#f4f1e8">Couch Cube</text>
    <text x="-85" y="45" font-size="35" fill="#a7bec0">Your Mac. Your games. Your couch.</text>
  </g>
