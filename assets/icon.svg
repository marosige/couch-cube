<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Couch Cube</title>
  <desc id="desc">A geometric black 16:9 TV and silver Mac mini above a solid oak base that follows the icon's lower corners.</desc>
  <defs>
