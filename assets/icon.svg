      <rect x="16" y="16" width="992" height="992" rx="210"/>
    </clipPath>
    <filter id="tv-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dy="6" stdDeviation="7" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect x="16" y="16" width="992" height="992" rx="210" fill="#87aba3"/>
  <rect x="16" y="897" width="992" height="111" fill="#c7975c" clip-path="url(#icon-mask)"/>
  <g transform="translate(-112.64 -155.48) scale(1.22)">
  <rect x="154" y="221" width="716" height="413" rx="46" fill="#1a1a1a" filter="url(#tv-shadow)"/>
  <rect x="166" y="232.75" width="692" height="389.25" rx="34" fill="#000"/>
  <rect x="507" y="628" width="10" height="2" rx="1" fill="#fff" opacity=".5"/>
  </g>
  <g transform="translate(-1500 -1222.6) scale(2.8)">
  <rect x="755" y="748" width="100" height="9" rx="4" fill="#3b3b3b"/>
  <rect x="744" y="694" width="122" height="54" rx="18" fill="#c7c7c7"/>
  <rect x="748" y="692" width="114" height="12" rx="6" fill="#ebebeb"/>
  <g fill="#555">
    <rect x="776" y="728" width="12" height="5" rx="2"/>
    <rect x="801" y="728" width="12" height="5" rx="2"/>
  </g>
  <circle cx="838" cy="731" r="2" fill="#fff"/>
  </g>
</svg>
